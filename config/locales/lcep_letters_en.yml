      <p>Having reviewed your request and the evidence provided, I am not satisfied that there is sufficient evidence for me to waive your fee on this occasion and I am <strong>refusing</strong> your application.</p>
      <p>This is because:</p>
      <p><span class="red-text">[INSERT REASONS – here you can set out what is missing from the applicant's evidence or what would need to be provided in order to grant the application]</span></p>
      <h3 class='govuk-heading-m'>What you can do next</h3>
      <p>You can pay the <span class="red-text">[full/partial] [court/tribunal]</span> fee in the sum of <span class="red-text">[INSERT FEE AMOUNT £X]</span>.</p>
      <p><span class="red-text">[INSERT IF APPLICABLE e.g. partial fee</span>: This figure is calculated based on <span class="red-text">eg. [the outcome of your Help with Fees application dated [INSERT DATE OF HwF APPLICATION] – reference number [INSERT HwF REFERENCE NUMBER]]</span></p>
      <p>You can pay by:</p>
      <ul class="govuk-list govuk-list--bullet">
        <li>Calling <span class="red-text">&lt;add phone number&gt;</span> with your debit card details</li>
        <li>Posting a cheque written out to 'HM Courts and Tribunals Service' to the address at the top of this letter</li>
        <li><span class="red-text">[Providing your PBA number – DELETE IF NOT A LEGAL REP APPLYING]</span></li>
        <li><span class="red-text">[insert other payment method]</span></li>
      </ul>
      <p>If payment is not received within 14 days ie. <span class="red-text">[INSERT DATE]</span>, your <span class="red-text">[INSERT APPLICATION NAME]</span> will not be processed.</p>
      <p>If you are not satisfied with my decision, you can appeal my decision by writing directly to <span class="red-text">[INSERT NAME OF SEO/ OPERATIONS MANAGER] [or by emailing - INSERT EMAIL ADDRESS IF APPLICABLE]</span>. Your stage 2 request must be received by the <span class="red-text">[court/tribunal]</span> within 14 days i.e. <span class="red-text">[INSERT DATE – 14 days from day you send response]</span>.</p>
      <p><span class="red-text">[INSERT NAME OF SEO/ OPERATIONS MANAGER]</span> will endeavour to respond within 10 working days from receiving your stage 2 review request. Please make sure you state 'Lord Chancellor's Exceptional Power – Stage 2 review – [your name]' in your letter/email to avoid delays.</p>
      <p>Your request must state the reasons you disagree with my decision and provide the following information:</p>
      <p><strong class="red-text">[Example paragraphs below you may wish to use but ultimately the contents of this letter should be reviewed upon a case by case basis and all comments in the request should be addressed line by line:</strong></p>
      <ul class="govuk-list govuk-list--bullet red-text">
        <li>Providing an explanation to the [court/tribunal] with the reasonings as to why your [INSERT APPLICATION NAME] needs to be made in the [court/tribunal] urgently now, rather than a later date when you may be in a different financial position where you may be able to finance the fee.</li>
        <li>In considering exceptional circumstances the [court/tribunal] needs to establish that you have made every effort to finance the [court/tribunal] fee. Can you please expand on what you have done to secure the fee of [INSERT FEE AMOUNT £X]?</li>
        <li>Provide the [court/tribunal] with evidence of why you are unable to pay the fee or what detriment this will have by paying the fee. The type of evidence you would need to provide include any notices or threatening legal action against you for non-payment of bills and accommodation costs etc. We also will need evidence you have exhausted sources of funds such as legal expenses insurance, loans and overdrafts and, in the case of immigration related matters, financial support from your sponsors. <strong>]</strong></li>
      </ul>
      <p><span class="red-text">[INSERT NAME OF SEO/ OPERATIONS MANAGER]</span>'s decision is final.</p>
      <p>Yours sincerely</p>
      <p><strong class="red-text">[Your Initial &amp; Surname]</strong><br><strong>Delivery Manager</strong><br><strong class="red-text">[Insert Court/Tribunal name]</strong></p>
