en-GB:
  lcep_letters:
    initial_information_html: |
      <p>Dear <span class="red-text">[INSERT APPLICANT NAME]</span></p>
      <p><strong>Re: Inability to pay <span class="red-text">[court/tribunal]</span> fee <span class="red-text">[INSERT FEE AMOUNT £X]</span> for <span class="red-text">[INSERT APPLICATION NAME]</span></strong></p>
      <p>Thank you for your <span class="red-text">[letter/email]</span> dated <span class="red-text">[INSERT DATE]</span>.</p>
      <p>I note the contents of your <span class="red-text">[email/letter]</span> and your position regarding being unable to pay the <span class="red-text">[court/tribunal]</span> fee due to <span class="red-text">[INSERT REASONS GIVEN]</span>.</p>
      <p><strong class="red-text">[INSERT BRIEF BACKGROUND/CONTEXT: -</strong><span class="red-text"> i.e. have they tried to apply for HwF but that has failed? Have they appealed their HwF outcome, but their appeal grounds are not valid e.g. unable to afford the fee due to outgoings? Are they ineligible for HwF but they state they are unable to afford the fee due to exceptional circumstances? Have they been granted a partial fee remission but are stating they still can't afford that? Have they exhausted the HwF appeal route but are claiming they still can't pay?]</span></p>
      <p><strong class="red-text">[INCLUDE THIS PARAGRAPH IF THEY HAVE ALREADY APPLIED FOR HELP WITH FEES (WHICH HAS FAILED/PART REMISSION) AND ARE TRYING TO APPEAL ON THE BASIS THAT THEY CANNOT AFFORD THE FEE DUE TO THEIR EXPENSES/OUTGOINGS:</strong> The Help with Fees scheme cannot take into account expenditure/outgoings so no appeals can be successfully made on this basis. Accordingly, you may instead wish to apply for help with this fee under the Lord Chancellor's Exceptional Power to remit fees, if you can provide evidence that the below applies to you.<strong class="red-text">]</strong></p>
      <p>Based on the information you have provided, you may wish to apply for help with the <span class="red-text">[court/tribunal]</span> fee under the Lord Chancellor's Exceptional Power scheme.</p>
      <p>Under the Lord Chancellor's Exceptional Power, a part or full fee remission may be granted if there is evidence to show 'exceptional hardship' or there are 'exceptional circumstances' which prevents an individual from being able to pay a court or tribunal fee. Your application and evidence will be considered by a Delivery Manager who will need to establish that you have made every effort to finance the fee and could not bring the application requiring a fee at a later date.</p>
      <p><strong>If you wish to apply under the Lord Chancellor's Exceptional Power, you will need to:</strong></p>
      <ul class="govuk-list govuk-list--bullet">
        <li>Provide an explanation to the <span class="red-text">[court/tribunal]</span> with the reasons as to why your application <span class="red-text">[INSERT APPLICATION NAME]</span> needs to be made now and cannot be delayed until you may be able to finance the fee.</li>
        <li>Demonstrate you have applied for Help with Fees and that you are not eligible for Help with Fees and have subsequently made every effort to finance the <span class="red-text">[court/tribunal]</span> fee i.e. what have you done to try and secure the fee of <span class="red-text">[INSERT FEE AMOUNT £X]</span></li>
        <li>Provide evidence of why you are unable to pay the fee or what detriment paying will have. The type of evidence you would need to provide could include any notices or letters threatening legal action against you for non-payment of bills and accommodation costs etc. We also will need evidence you have exhausted sources of funds such as legal expenses insurance, loans and overdrafts and, in the case of immigration related matters, financial support from your sponsors.</li>
        <li>Provide an explanation and evidence of the exceptional situation or misfortune that imposes sufficient pressure on you that makes you unable to pay the fee, if you wish to declare 'exceptional circumstances'.</li>
        <li>You will also need to include the copy of <strong>all</strong> the evidence you originally provided in your Help with Fees application and Help with Fees appeal to the <span class="red-text">[court/tribunal]</span> for your Help with Fees application, including bank statements.</li>
      </ul>
      <p>You will need to provide the above to have your application assessed under the Lord Chancellor's Exceptional Power. The Delivery Manager will endeavour to respond within 10 working days from receiving your request. Please make sure you state 'Lord Chancellor's Exceptional Power application – [your name]' in the letter/email to avoid delays.</p>
      <p><strong>Alternatively, if you decide to pay the fee:</strong></p>
      <p>You need to pay the fee amount of <span class="red-text">[INSERT FEE AMOUNT £X]</span> to progress your <span class="red-text">[INSERT APPLICATION NAME]</span>.</p>
      <p><span class="red-text">[INSERT IF APPLICABLE e.g. partial fee</span>: This figure is calculated based on <span class="red-text">[INSERT REASON] – eg. [the outcome of your Help with Fees application dated [INSERT DATE OF HwF APPLICATION] – reference number [INSERT HwF REFERENCE NUMBER]]</span></p>
      <p>You can pay by:</p>
      <ul class="govuk-list govuk-list--bullet">
        <li>Calling <span class="red-text">&lt;add phone number&gt;</span> with your debit card details</li>
        <li>Posting a cheque written out to 'HM Courts and Tribunals Service' to the address at the top of this letter</li>
        <li><span class="red-text">[Providing your PBA number – DELETE IF NOT A LEGAL REP APPLYING]</span></li>
        <li><span class="red-text">[insert other payment method]</span></li>
      </ul>
      <p>Once payment has been received, your <span class="red-text">[INSERT APPLICATION NAME]</span> will then be processed accordingly. If payment is not received within 14 days i.e. <span class="red-text">[INSERT DATE]</span>, your <span class="red-text">[INSERT APPLICATION NAME]</span> will not be processed.</p>
      <p>Yours sincerely</p>
      <p><strong class="red-text">[Your Initial &amp; Surname]</strong><br><strong class="red-text">[Insert job role]</strong><br><strong class="red-text">[Insert Court/Tribunal name]</strong></p>
    stage_one_upheld_html: |
      <p>Dear <span class="red-text">[INSERT APPLICANT NAME]</span></p>
      <p><strong>Lord Chancellor's Exceptional Power Application - <span class="red-text">[INSERT APPLICANT'S NAME]</span></strong></p>
      <p>Thank you for your <span class="red-text">[email/letter]</span> dated <span class="red-text">[INSERT DATE]</span> requesting a consideration of your application for fee remission under the Lord Chancellor's Exceptional Power.</p>
      <p>I note the contents of your <span class="red-text">[email/letter]</span> and your position. Under the Lord Chancellor's exceptional power to remit a fee, you are required to provide evidence to support a declaration of suffering 'exceptional hardship' or there being 'exceptional circumstances'. I therefore need to establish that you have made every effort to finance the <span class="red-text">[court/tribunal]</span> fee.</p>
      <h3 class='govuk-heading-m'>Decision</h3>
      <p>Having reviewed your request and the evidence provided, I have decided to <strong><span class="red-text">[partially]</span> uphold</strong> your request to waiver the <span class="red-text">[court/tribunal]</span> fee of <span class="red-text">[INSERT FEE AMOUNT £X]</span> in relation to <span class="red-text">[INSERT APPLICATION NAME]</span>, under the Lord Chancellor's Exceptional Power.</p>
      <p>This is because I am satisfied that you have met the criteria for a <span class="red-text">[partial]</span> fee remission under the Lord Chancellor's Exceptional Power scheme.</p>
      <p><strong class="red-text">[CHOOSE APPROPRIATE PARAGRAPH BASED ON WHETHER PART PAYMENT IS STILL REQUIRED:</strong></p>
      <p>The outcome of your application is that you will receive full help with this <span class="red-text">[court/tribunal]</span> fee. Your <span class="red-text">[INSERT APPLICATION NAME]</span> will now be processed.</p>
      <p>Please note that this decision is only in relation to the above <span class="red-text">[court/tribunal]</span> fee in relation to <span class="red-text">[INSERT APPLICATION NAME]</span>. You will need to either pay, <span class="red-text">[make a brand new Help with Fees application]</span> or make the appropriate Lord Chancellor's Exceptional Power application for any future court/tribunal fees payable.</p>
      <p><strong class="red-text">OR</strong></p>
      <p>The outcome of your application is that you will receive partial help with this <span class="red-text">[court/tribunal]</span> fee. This is because <span class="red-text">[INSERT REASONS]</span></p>
      <p>This figure is calculated based on <span class="red-text">[INSERT REASON - [the outcome of your Help with Fees application dated [INSERT DATE OF HwF APPLICATION] – reference number [INSERT HwF REFERENCE NUMBER]]</span></p>
      <p>You need to pay the remaining fee amount of <span class="red-text">[INSERT FEE AMOUNT £X]</span> to progress your <span class="red-text">[INSERT APPLICATION NAME.]</span></p>
      <p>You can pay by:</p>
      <ul class="govuk-list govuk-list--bullet">
        <li>Calling <span class="red-text">&lt;add phone number&gt;</span> with your debit card details</li>
        <li>Posting a cheque written out to 'HM Courts and Tribunals Service' to the address at the top of this letter</li>
        <li><span class="red-text">[Providing your PBA number – DELETE IF NOT A LEGAL REP APPLYING]</span></li>
        <li><span class="red-text">[insert other payment method]</span></li>
      </ul>
      <p>If payment is not received within 14 days ie. <span class="red-text">[INSERT DATE]</span>, your <span class="red-text">[INSERT APPLICATION NAME]</span> will not be processed.</p>
      <p>Please note that this decision is only in relation to the above <span class="red-text">[court/tribunal]</span> fee in relation to <span class="red-text">[INSERT APPLICATION NAME]</span>. You will need to either pay, <span class="red-text">[make a brand new Help with Fees application]</span> or make the appropriate Lord Chancellor's Exceptional Power application for any future court/tribunal fees payable.</p>
      <p>If you are not satisfied with my decision, you can appeal my decision by writing directly to <span class="red-text">[INSERT NAME OF SEO/ OPERATIONS MANAGER] [or by emailing - INSERT EMAIL ADDRESS IF APPLICABLE]</span>. Your stage 2 request must be received by the <span class="red-text">[court/tribunal]</span> within 14 days i.e. <span class="red-text">[INSERT DATE – 14 days from day you send response]</span>.</p>
      <p><span class="red-text">[INSERT NAME OF SEO/ OPERATIONS MANAGER]</span> will endeavour to respond within 10 working days from receiving your stage 2 review request. Please make sure you state 'Lord Chancellor's Exceptional Power – Stage 2 review – [your name]' in your letter/email to avoid delays.</p>
      <p>Your request must state the reasons you disagree with my decision and include all previous evidence and applications submitted and any further supporting evidence.</p>
      <p><span class="red-text">[INSERT NAME OF SEO/ OPERATIONS MANAGER]</span>'s decision is final.<strong class="red-text">]</strong></p>
      <p>Yours sincerely</p>
      <p><strong class="red-text">[Your Initial &amp; Surname]</strong><br><strong>Delivery Manager</strong><br><strong class="red-text">[Insert Court/Tribunal name]</strong></p>
    stage_one_refused_html: |
