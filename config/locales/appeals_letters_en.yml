    stage_one_on_issue_refused_html: |
      <p>Dear <span class="red-text">[INSERT APPLICANT NAME]</span></p>
      <p><strong>Help with Fees – On Issue: Stage 1 <span class="red-text">[Benefit/Income]</span> Appeal – <span class="red-text">[INSERT APPLICANT NAME &amp; HWF REFERENCE NUMBER]</span></strong></p>
      <p>Thank you for your <span class="red-text">[letter/email]</span> dated <span class="red-text">[INSERT DATE]</span> appealing the decision to not <span class="red-text">[fully]</span> grant <span class="red-text">your/your client's</span> application for Help with Fees - reference number: <span class="red-text">[INSERT HWF REFERENCE NUMBER]</span>.</p>
      <h3 class='govuk-heading-m'>Stage 1 <span class="red-text">[Benefit/Income]</span> Appeal Decision</h3>
      <p>I have reviewed your evidence and reasons for appealing the decision made on your Help with Fees application <span class="red-text">[INSERT HWF REFERENCE NUMBER]</span>, and I have decided to <strong>refuse</strong> your appeal.</p>
      <p><strong>The reasons for refusing your appeal are:</strong></p>
      <p><span class="red-text">[INSERT REASONS HERE]</span></p>
      <h3 class='govuk-heading-m'>Your next steps</h3>
      <p>Pay the <span class="red-text">[court/tribunal]</span> fee:</p>
      <p>You can pay the <span class="red-text">[full/partial] [court/tribunal]</span> fee based on the original Help with Fees decision made on <span class="red-text">[INSERT DATE]</span> in the sum of <span class="red-text">[INSERT FEE AMOUNT £X]</span>.</p>
      <p>You can pay by:</p>
      <ul class="govuk-list govuk-list--bullet">
        <li>Calling <span class="red-text">&lt;add phone number&gt;</span> with your debit card details</li>
        <li>Posting a cheque written out to 'HM Courts and Tribunals Service' to the address at the top of this letter</li>
        <li><span class="red-text">[Providing your PBA number [DELETE IF NOT A LEGAL REP APPLYING]]</span></li>
        <li><span class="red-text">[insert other payment method]</span></li>
      </ul>
      <p>Once payment has been received, your <span class="red-text">[INSERT APPLICATION NAME]</span> will then be processed accordingly. If payment is not received within 14 days ie. <span class="red-text">[INSERT DATE]</span>, your <span class="red-text">[INSERT APPLICATION NAME]</span> will not be processed.</p>
      <p>Stage 2 <span class="red-text">[Income/Benefit]</span> Appeal:</p>
      <p>If you are not satisfied with my decision, you can appeal my decision by writing directly to <span class="red-text">[INSERT NAME OF STAGE 2 APPEAL HANDLER – i.e. must be one band/grade higher than stage 1 appeal handler] [or by emailing - INSERT EMAIL ADDRESS IF APPLICABLE]</span>. Your stage 2 appeal must be received by the <span class="red-text">[court/tribunal]</span> within 14 days i.e. <span class="red-text">[INSERT DATE – 14 calendar days from the day you send the reply]</span>.</p>
      <p><span class="red-text">[INSERT NAME OF STAGE 2 APPEAL HANDLER – must be one band/grade higher than stage 1 appeal handler]</span> will endeavour to respond within 10 working days from receiving your stage 2 appeal request. Please make sure you state 'Help with Fees Stage 2 <span class="red-text">[Benefit/Income]</span> Appeal – [your name]' in your letter/email to avoid delays.</p>
      <p>Your appeal must state the reasons you disagree with my decision and include the following:</p>
      <ul class="govuk-list govuk-list--bullet">
        <li>All previous evidence and applications submitted</li>
        <li><span class="red-text">[ONLY INCLUDE IF APPLICABLE]</span> Evidence and explanations of the accounts/transactions listed in the reasons for not upholding your appeal</li>
        <li>Any further supporting evidence</li>
      </ul>
      <p>The declaration section of the Help with Fees application makes clear the need for you to complete the application to the best of your knowledge. It goes on to state that the giving of false information or the failure to provide evidence if requested may result in a rejection of that application. When completing the document, the <span class="red-text">[court/tribunal]</span> expects applicants to have read the guidance provided to make sure that the completion of the form is as accurate as possible. You can find the guidance here: <a href="https://www.gov.uk/government/publications/how-to-apply-for-help-with-a-court-or-tribunal-fee-ex160a/how-to-apply-for-help-with-fees-ex160a" target="_blank">https://www.gov.uk/government/publications/how-to-apply-for-help-with-a-court-or-tribunal-fee-ex160a/how-to-apply-for-help-with-fees-ex160a</a></p>
      <p><span class="red-text">[INSERT NAME OF STAGE 2 APPEAL HANDLER – must be one band/grade higher than stage 1 appeal handler]</span>'s decision is final and there is no further route of appeal after that.</p>
      <p>Yours sincerely</p>
      <p><strong class="red-text">[Your Initial &amp; Surname]</strong><br><strong>Help with Fees Stage 1 Appeal Handler</strong><br><strong class="red-text">[Insert Court/Tribunal name]</strong></p>
